type: markdown
#title: Volgende ophaling
content: >
  {% set today = now().date() %}

  {# --- Base64 afbeeldingen --- #}
  {% set img_restafval = "data:image/svg+xml;base64," %}
  {% set img_gft = "data:image/svg+xml;base64," %}
  {% set img_plastic = "data:image/svg+xml;base64," %}
  {% set img_papier_container = "data:image/svg+xml;base64," %}
  {% set img_papier_school = "data:image/svg+xml;base64," %}
  {% set img_kerstboom = "data:image/svg+xml;base64," %}

  {# --- Volgende reguliere ophaling --- #}
  {% set pickups = [
    {
      "name": "Restafval",
      "image": img_restafval,
      "date": states('sensor.restafval_ophaaldag')
    },
    {
      "name": "GFT",
      "image": img_gft,
      "date": states('sensor.gft_ophaaldag')
    },
    {
      "name": "Verpakkingen",
      "image": img_plastic,
      "date": states('sensor.plastic_pakketjes_ophaaldag')
    },
    {
      "name": "Papier",
      "image": img_papier_container,
      "date": states('sensor.papier_ophaaldag')
    },
    {
      "name": "Kerstboom",
      "image": img_kerstboom,
      "date": states('sensor.kerstboom_ophaaldag')
    }
  ] %}

  {% set ns = namespace(next_name="Onbekend", next_image=img_restafval, next_date=none, next_days=9999) %}

  {% for pickup in pickups %}
    {% if pickup.date not in ['unknown', 'unavailable', 'None', ''] %}
      {% set pickup_d = strptime(pickup.date, '%Y-%m-%d').date() %}
      {% set diff = (pickup_d - today).days %}
      {% if diff >= 0 and diff < ns.next_days %}
        {% set ns.next_name = pickup.name %}
        {% set ns.next_image = pickup.image %}
        {% set ns.next_date = pickup_d %}
        {% set ns.next_days = diff %}
      {% endif %}
    {% endif %}
  {% endfor %}

  {# --- Reguliere ophaling weergeven --- #}
  {% if ns.next_date %}
    {% if ns.next_days == 0 %}
  <img src="{{ ns.next_image }}" width="32" style="vertical-align: middle;"> **Vandaag: {{ ns.next_name }}**
    {% elif ns.next_days == 1 %}
  <img src="{{ ns.next_image }}" width="32" style="vertical-align: middle;"> **Morgen: {{ ns.next_name }}**
    {% else %}
  <img src="{{ ns.next_image }}" width="32" style="vertical-align: middle;"> Over **{{ ns.next_days }} dagen**: {{ ns.next_name }}
    {% endif %}
  {% endif %}

  {# --- Bereken 3e woensdag van deze en volgende maand (papier school) --- #}
  {% set pns = namespace(papier_date=none) %}

  {% for offset in [0, 1] %}
    {% if pns.papier_date == none %}
      {% set check_year = (today.replace(day=1) + timedelta(days=32 * offset)).year %}
      {% set check_month = (today.replace(day=1) + timedelta(days=32 * offset)).month %}
      {% set first_day = today.replace(year=check_year, month=check_month, day=1) %}
      {% set first_wednesday = first_day + timedelta(days=(2 - first_day.weekday() + 7) % 7) %}
      {% set third_wednesday = first_wednesday + timedelta(days=14) %}
      {% if third_wednesday >= today %}
        {% set pns.papier_date = third_wednesday %}
      {% endif %}
    {% endif %}
  {% endfor %}

  {# --- Papier school weergeven als binnen 7 dagen --- #}
  {% if pns.papier_date %}
    {% set papier_days = (pns.papier_date - today).days %}
    {% if papier_days <= 7 %}
      {% if papier_days == 0 %}
  <img src="{{ img_papier_school }}" width="32" style="vertical-align: middle;"> **Vandaag: Papier (school)**
      {% elif papier_days == 1 %}
  <img src="{{ img_papier_school }}" width="32" style="vertical-align: middle;"> **Morgen: Papier (school)**
      {% else %}
  <img src="{{ img_papier_school }}" width="32" style="vertical-align: middle;"> Over **{{ papier_days }} dagen**: Papier (school)
      {% endif %}
    {% endif %}
  {% endif %}
