type: markdown
#title: Volgende ophaling
content: >
  {% set today = now().date() %}

  {% set pickups = [
    {
      "name": "Restafval",
      "image": "/local/afvalwijzer/restafval.svg",
      "date": states('sensor.non_recyclable_waste_pickup')
    },
    {
      "name": "GFT",
      "image": "/local/afvalwijzer/gft.svg",
      "date": states('sensor.organic_waste_pickup')
    },
    {
      "name": "Plastic/Pakketjes",
      "image": "/local/afvalwijzer/plastic.svg",
      "date": states('sensor.packages_waste_pickup')
    },
    {
      "name": "Papier",
      "image": "/local/afvalwijzer/papier.svg",
      "date": states('sensor.paper_waste_pickup')
    }
  ] %}

  {% set ns = namespace(next_name="Onbekend", next_image="/local/afvalwijzer/restafval.svg", next_date="9999-12-31") %}

  {% for pickup in pickups %}
    {% if pickup.date not in ['unknown', 'unavailable', 'None', ''] %}
      {% if pickup.date < ns.next_date and pickup.date >= today | string %}
        {% set ns.next_name = pickup.name %}
        {% set ns.next_image = pickup.image %}
        {% set ns.next_date = pickup.date %}
      {% endif %}
    {% endif %}
  {% endfor %}

  {% set pickup_date = strptime(ns.next_date, '%Y-%m-%d').date() if ns.next_date != '9999-12-31' else none %}
  {% if pickup_date %}
    {% set days = (pickup_date - today).days %}
    {% if days == 0 %}
  <img src="{{ ns.next_image }}" width="48"> **Vandaag: {{ ns.next_name }}**
    {% elif days == 1 %}
  <img src="{{ ns.next_image }}" width="48"> **Morgen: {{ ns.next_name }}**
    {% else %}
  <img src="{{ ns.next_image }}" width="48"> Over **{{ days }} dagen**: {{ ns.next_name }}
    {% endif %}
  {% endif %}
